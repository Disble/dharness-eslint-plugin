name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows is not optional: these rules read files off disk — the
        # thresholds file, the role-file siblings — and path handling is
        # exactly where that breaks.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Third-party actions are pinned to a commit: a tag is a moving pointer
      # the action's own repository can repoint at any time.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate
        run: bun run validate

      - name: Build
        run: bun run build

      # Proves both consumer entry points resolve from the real tarball. It
      # runs on Windows too, because that is where a path bug would show.
      - name: Tarball end-to-end
        run: bun run e2e:pack

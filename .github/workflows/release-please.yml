name: Release Please

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  # Tags created with GITHUB_TOKEN do not trigger other workflows, so the
  # publish happens here rather than on a tag push that would never fire.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; node 22 ships npm 10.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - run: bun install --frozen-lockfile
      - run: bun run build

      # Authenticates via OIDC trusted publishing: no token in secrets, and
      # provenance is attached. prepublishOnly re-runs validate and build, so a
      # stale dist can never ship.
      - name: Publish
        run: npm publish --access public
